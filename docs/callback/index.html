<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Spotify connection code</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121212; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
    main { max-width: 36rem; padding: 2rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { color: #b3b3b3; line-height: 1.5; }
    textarea { width: 100%; box-sizing: border-box; height: 7rem; margin: 1rem 0; padding: .75rem; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; font: .9rem ui-monospace, Consolas, monospace; resize: none; }
    button { background: #1db954; color: #000; border: 0; border-radius: 999px; padding: .7rem 1.6rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .err { color: #ff8080; }
  </style>
</head>
<body>
  <main>
    <h1 id="h">Spotify connection code</h1>
    <p id="p">One moment…</p>
    <textarea id="code" readonly hidden></textarea>
    <button id="copy" hidden type="button">Copy code</button>
    <p>This page runs in your browser only. It shows the code Spotify sent and does not store or send it anywhere.</p>
  </main>
  <script>
    var q = new URLSearchParams(location.search);
    var code = q.get("code"), error = q.get("error");
    var h = document.getElementById("h"), p = document.getElementById("p"), box = document.getElementById("code"), btn = document.getElementById("copy");
    if (code) {
      h.textContent = "Copy this code";
      p.textContent = "Paste it into the \"Paste code here\" setting of the Library Player widget in iCUE.";
      box.value = code; box.hidden = false; btn.hidden = false;
      btn.onclick = function () { box.select(); (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.resolve(document.execCommand("copy"))).then(function () { btn.textContent = "Copied"; }); };
    } else {
      h.textContent = "Nothing to copy";
      p.className = "err";
      p.textContent = error ? "Spotify returned: " + error + ". Go back to the widget and tap Connect again." : "Open this page from the Connect button in the widget.";
    }
  </script>
</body>
</html>
